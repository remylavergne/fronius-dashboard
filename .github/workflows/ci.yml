name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go — vet, tests, static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The Go version follows go.mod: a single source of truth.
          go-version-file: go.mod
          cache: true

      - name: No versioned device password
        # A non-empty password must never be committed: .env.example
        # carries an empty value and .env is ignored by git.
        # The name is assembled so this step does not detect itself.
        # The full pattern must also not appear verbatim in the
        # documentation: it would trigger this step.
        run: |
          nom='FRONIUS_DEVICE_PASSWORD'
          if git grep -nE "${nom}=.+"; then
            echo "::error::non-empty device password versioned"
            exit 1
          fi
          echo "no versioned device password"

      - name: Static analysis
        run: go vet ./...

      - name: Tests (race detector)
        run: go test ./... -race

      - name: Build without CGO (static binaries)
        run: CGO_ENABLED=0 go build ./...

  web:
    name: Frontend — lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test --run

      - name: Build (strict typecheck included)
        run: pnpm build
